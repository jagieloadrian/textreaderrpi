[platformio]
default_envs = esp32dev

[env:base]
platform = espressif32
framework = arduino
lib_deps =
    gilmaimon/ArduinoWebsockets @ ^0.5.3
    bblanchon/ArduinoJson @ ^7.0.0
    majicdesigns/MD_MAX72XX @ ^3.5.1
    majicdesigns/MD_Parola @ ^3.7.3
    tzapu/WiFiManager @ ^2.0.17
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit SSD1327 @ ^1.0.0
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.2
    adafruit/Adafruit LED Backpack Library @ ^1.3.4
    adafruit/Adafruit PCD8544 Nokia 5110 LCD Library @ ^2.0.1
    zinggjm/GxEPD2 @ ^1.6.2
    olikraus/U8g2 @ ^2.35.7
    Nkawu/TFT_22_ILI9225 @ ^2.0.4

[env:esp32dev]
extends = base
board = esp32dev
build_flags = -DDISPLAY_DRIVER_MAX7219

[env:esp32-s3]
extends = base
board = esp32-s3-devkitc-1
build_flags = -DDISPLAY_DRIVER_MAX7219

[env:esp32-s2]
extends = base
board = esp32-s2-saola-1
build_flags = -DDISPLAY_DRIVER_MAX7219

[env:esp32-c3]
extends = base
board = esp32-c3-devkitm-1
build_flags = -DDISPLAY_DRIVER_MAX7219

[env:esp32-c2]
extends = base
board = esp32-c2-devkitm-1
; ESP32-C2 has no hardware floating point — verify lib_deps compile without FPU
build_flags = -DDISPLAY_DRIVER_MAX7219

[env:esp32-h2]
extends = base
board = esp32-h2-devkitm-1
; ESP32-H2 uses IEEE 802.15.4 (Thread/Zigbee) — NO WiFi. Use S2/S3/C3/C2 if WiFi required.
build_flags = -DDISPLAY_DRIVER_MAX7219
