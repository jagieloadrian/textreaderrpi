{{- $secretName := printf "%s-secret" (include "textreaderrpi.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.database.password -}}
{{- if not $password }}
{{- if $existing }}
{{- $password = index $existing.data "DATABASE_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 16 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "textreaderrpi.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.database.user | quote }}
  DATABASE_PASSWORD: {{ $password | quote }}
