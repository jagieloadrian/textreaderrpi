name: Firmware CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pico:
    name: Pico W firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    strategy:
      matrix:
        board: [pico_w, pico2_w]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Restore/cache pico-sdk
        id: cache-pico
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/pico-sdk
          key: pico-sdk-${{ runner.os }}-v2
          restore-keys: |
            pico-sdk-${{ runner.os }}-

      - name: Clone pico-sdk 2.1.1 (if cache miss)
        if: steps.cache-pico.outputs.cache-hit != 'true'
        run: |
          # Clone into workspace to avoid permission issues writing to /opt
          git clone --depth 1 --branch 2.1.1 \
            https://github.com/raspberrypi/pico-sdk.git $GITHUB_WORKSPACE/pico-sdk
          cd $GITHUB_WORKSPACE/pico-sdk && git submodule update --init --recursive
          echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> "$GITHUB_ENV"

      - name: CMake configure (${{ matrix.board }})
        run: |
          # Ensure project has minimal config.h and lwipopts.h to satisfy SDK includes in CI
          if [ ! -f firmware/pico/config.h ]; then
            cat > firmware/pico/config.h <<'EOF'
#ifndef CONFIG_H
#define CONFIG_H
#define WIFI_SSID ""
#define WIFI_PASS ""
#define SERVER_HOST ""
#define SERVER_PORT 8080
#define ZONE_ID "pico"
#define NUM_DEVICES 4
#define RECONNECT_INTERVAL_MS 5000
#define FLASH_CRED_OFFSET (256*1024)
#endif
EOF
          fi
          if [ ! -f firmware/pico/src/lwipopts.h ]; then
            cat > firmware/pico/src/lwipopts.h <<'EOF'
#ifndef LWIPOPTS_H
#define LWIPOPTS_H
#define LWIP_SOCKET 1
#define SO_REUSE 1
// Minimal options for CI builds; adjust for hardware-specific configs
#endif
EOF
          fi
          cmake -S firmware/pico -B firmware/pico/build \
            -DPICO_BOARD=${{ matrix.board }} \
            -DCMAKE_BUILD_TYPE=MinSizeRel

      - name: Build textreader
        run: cmake --build firmware/pico/build --target textreader -j$(nproc)

      - name: Upload Pico firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.board }}-firmware
          path: |
            firmware/pico/build/textreader.uf2
            firmware/pico/build/textreader_combined.uf2
          if-no-files-found: error

  esp32:
    name: ESP32 firmware (esp32)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IDF_PATH: ${{ github.workspace }}/esp-idf

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore/cache esp-idf
        id: cache-esp
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/esp-idf
            ~/.cache/pip
          key: esp-idf-${{ runner.os }}-v5.2.1
          restore-keys: |
            esp-idf-${{ runner.os }}-

      - name: Install ESP-IDF v5.2.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build \
            libssl-dev libusb-1.0-0 libffi-dev dfu-util python3-venv python3-pip
          # Clone into workspace to avoid permission issues writing to /opt
          git clone --depth 1 --branch v5.2.1 \
            https://github.com/espressif/esp-idf.git $GITHUB_WORKSPACE/esp-idf
          cd $GITHUB_WORKSPACE/esp-idf && git submodule update --init --recursive && ./install.sh esp32
          echo "IDF_PATH=$GITHUB_WORKSPACE/esp-idf" >> "$GITHUB_ENV"

      - name: Install ESP-IDF Python requirements
        run: |
          # Install requirements from the most likely locations in esp-idf
          if [ -f "${{ github.workspace }}/esp-idf/requirements.txt" ]; then
            python3 -m pip install --user -r "${{ github.workspace }}/esp-idf/requirements.txt"
          elif [ -f "${{ github.workspace }}/esp-idf/tools/requirements/requirements.core.txt" ]; then
            python3 -m pip install --user -r "${{ github.workspace }}/esp-idf/tools/requirements/requirements.core.txt"
          else
            echo "No requirements file found in esp-idf; skipping pip install"
          fi

      - name: CMake configure (esp32)
        run: |
          . ${{ env.IDF_PATH }}/export.sh
          cmake -S firmware/esp32 -B firmware/esp32/build \
            -DIDF_TARGET=esp32 \
            -DCMAKE_BUILD_TYPE=MinSizeRel

      - name: Build ESP32 firmware
        run: |
          . ${{ env.IDF_PATH }}/export.sh
          cmake --build firmware/esp32/build -j$(nproc)

      - name: Upload ESP32 firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            firmware/esp32/build/textreader.bin
            firmware/esp32/build/textreader.elf
          if-no-files-found: error
